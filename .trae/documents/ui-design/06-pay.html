<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 订阅支付 · 趣算算</title>
<style>
:root {
  --bg: #F7F5F0;          /* 宣纸暖白，页面底 */
  --card: #FFFFFF;         /* 卡片 */
  --brand: #4A4E8F;        /* 黛蓝紫，主色/Tab选中/主CTA */
  --brand-soft: #EEEFF9;   /* 主色浅底 */
  --gold: #C9A86A;         /* 金色点缀：会员/吉/高亮边框 */
  --ink: #2B2B33;          /* 主文字 */
  --ink-2: #8A8A93;        /* 次文字 */
  --success: #2E9E6B;      /* 宜/吉 */
  --danger: #D9534F;       /* 忌/凶 */
  --radius-card: 16px; --radius-pill: 999px;
  font-family: -apple-system, "PingFang SC", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#17171C; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:32px 0; }
.phone { width:390px; min-height:844px; background:var(--bg); border:11px solid #101014; border-radius:44px; box-shadow:0 30px 80px rgba(0,0,0,.55); display:flex; flex-direction:column; position:relative; overflow:hidden; }
/* 状态栏 */
.statusbar { height:46px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; }
.statusbar .time { font-size:15px; font-weight:600; color:var(--ink); letter-spacing:.2px; }
.statusbar .icons { display:flex; align-items:center; gap:6px; }
/* 内容区 */
.screen { flex:1; display:flex; flex-direction:column; padding:0 16px; }
/* 顶栏：返回+标题 */
.navbar { display:flex; align-items:center; gap:8px; padding:6px 4px 0; }
.navbar .title { font-size:17px; font-weight:700; color:var(--ink); }
/* 卡片 */
.card { background:var(--card); border-radius:var(--radius-card); padding:14px 16px; margin-top:14px; box-shadow:0 1px 4px rgba(43,43,51,.04); }
.card-title { font-size:15px; font-weight:700; color:var(--ink); }
/* 订单信息 */
.o-row { display:flex; justify-content:space-between; align-items:center; margin-top:11px; font-size:13px; }
.o-row .k { color:var(--ink-2); }
.o-row .v { color:var(--ink); font-weight:600; }
.o-row .v.gold { color:var(--gold); }
.social { margin-top:12px; padding-top:11px; border-top:1px dashed #EAE7DF; font-size:11.5px; color:var(--ink-2); text-align:center; }
/* 支付方式 */
.pay-item { display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid #F5F3ED; }
.pay-item:last-child { border-bottom:none; padding-bottom:4px; }
.pay-item:first-of-type { margin-top:4px; }
.plogo { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
.plogo.apple { background:#111; color:#fff; font-size:12px; font-weight:700; font-style:italic; }
.plogo.wechat { background:#2DC100; }
.plogo.alipay { background:#1677FF; color:#fff; font-size:13px; font-weight:700; }
.pname { font-size:14px; color:var(--ink); font-weight:500; }
.os { font-size:10.5px; color:var(--ink-2); background:#F1EFE9; border-radius:6px; padding:2px 7px; }
.radio { margin-left:auto; width:18px; height:18px; border-radius:50%; border:1.5px solid #D8D6CF; }
.radio.on { border:5.5px solid var(--brand); }
.pay-item.dim .pname { color:var(--ink-2); }
/* 应付金额 */
.amount-row { display:flex; justify-content:space-between; align-items:baseline; padding:20px 6px 0; }
.amount-row .k { font-size:14px; color:var(--ink); font-weight:500; }
.amount { font-size:28px; font-weight:800; color:var(--danger); }
.amount .rmb { font-size:16px; }
/* 底部按钮 */
.bottom-cta { margin-top:auto; padding:16px 0 30px; }
.cta-btn { background:var(--brand); color:#fff; font-size:16px; font-weight:700; text-align:center; border-radius:var(--radius-pill); padding:15px 0; box-shadow:0 6px 16px rgba(74,78,143,.35); }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#111; }
</style>
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#2B2B33"><rect x="0" y="6.5" width="3" height="4.5" rx="1"/><rect x="4.6" y="4.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="2.2" width="3" height="8.8" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#2B2B33" stroke-width="1.5" stroke-linecap="round"><path d="M1.5 3.6a10.5 10.5 0 0 1 13 0"/><path d="M3.9 6.3a7 7 0 0 1 8.2 0"/><circle cx="8" cy="9.2" r="1.4" fill="#2B2B33" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke="#2B2B33" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="#2B2B33"/><path d="M23.2 3.8v4.4c1-.3 1.6-1.2 1.6-2.2s-.6-1.9-1.6-2.2z" fill="#2B2B33" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div class="screen">
    <!-- 顶栏：返回+标题 -->
    <div class="navbar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      <span class="title">确认订单</span>
    </div>

    <!-- 订单信息 -->
    <div class="card">
      <div class="card-title">订单信息</div>
      <div class="o-row"><span class="k">商品</span><span class="v">趣算算VIP年卡</span></div>
      <div class="o-row"><span class="k">有效期</span><span class="v">2026-09-23 至 2027-09-23</span></div>
      <div class="o-row"><span class="k">首月特惠</span><span class="v gold">¥9.9（首月）</span></div>
      <div class="social">已有 2,317 位会员加入</div>
    </div>

    <!-- 支付方式 -->
    <div class="card">
      <div class="card-title">支付方式</div>
      <div class="pay-item">
        <span class="plogo apple">Pay</span>
        <span class="pname">Apple Pay</span>
        <span class="os">iOS</span>
        <span class="radio on"></span>
      </div>
      <div class="pay-item dim">
        <span class="plogo wechat">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="#fff"><ellipse cx="6" cy="5.4" rx="5.4" ry="4.6"/><path d="M11.2 8.2c.5 1.9-.6 3.8-2.8 4.6.5.6 1.3 1 2.2 1.1l-.6 1.1c1.4-.3 2.6-1 3.4-2 .9-.1 2-.6 2.6-1.5-1 .2-1.7 0-1.7 0s1.5-1.4 1.2-3.3c-.7 1.2-2.2 1.9-2.2 1.9s.1-.9-.2-1.9c-.4.5-.9 1-1.9 1z" opacity=".9"/></svg>
        </span>
        <span class="pname">微信支付</span>
        <span class="os">Android</span>
        <span class="radio"></span>
      </div>
      <div class="pay-item dim">
        <span class="plogo alipay">支</span>
        <span class="pname">支付宝</span>
        <span class="os">Android</span>
        <span class="radio"></span>
      </div>
    </div>

    <!-- 应付金额 -->
    <div class="amount-row">
      <span class="k">应付</span>
      <span class="amount"><span class="rmb">¥</span>178.00</span>
    </div>

    <!-- 确认支付 -->
    <div class="bottom-cta">
      <div class="cta-btn">确认支付</div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
