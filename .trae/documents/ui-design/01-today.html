<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 今日页 · 趣算算</title>
<style>
:root {
  --bg: #F7F5F0;          /* 宣纸暖白，页面底 */
  --card: #FFFFFF;         /* 卡片 */
  --brand: #4A4E8F;        /* 黛蓝紫，主色/Tab选中/主CTA */
  --brand-soft: #EEEFF9;   /* 主色浅底 */
  --gold: #C9A86A;         /* 金色点缀：会员/吉/高亮边框 */
  --ink: #2B2B33;          /* 主文字 */
  --ink-2: #8A8A93;        /* 次文字 */
  --success: #2E9E6B;      /* 宜/吉 */
  --danger: #D9534F;       /* 忌/凶 */
  --radius-card: 16px; --radius-pill: 999px;
  font-family: -apple-system, "PingFang SC", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#17171C; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:32px 0; }
.phone { width:390px; min-height:844px; background:var(--bg); border:11px solid #101014; border-radius:44px; box-shadow:0 30px 80px rgba(0,0,0,.55); display:flex; flex-direction:column; position:relative; overflow:hidden; }
/* 状态栏 */
.statusbar { height:46px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; }
.statusbar .time { font-size:15px; font-weight:600; color:var(--ink); letter-spacing:.2px; }
.statusbar .icons { display:flex; align-items:center; gap:6px; }
/* 内容区 */
.screen { flex:1; display:flex; flex-direction:column; padding:0 16px; }
/* 顶栏 */
.topbar { display:flex; justify-content:space-between; align-items:flex-start; padding:6px 4px 0; }
.greet { font-size:20px; font-weight:700; color:var(--ink); }
.lunar { font-size:12px; color:var(--ink-2); margin-top:3px; }
.top-right { text-align:right; }
.date { font-size:13px; color:var(--ink); font-weight:500; }
.bell { margin-top:6px; display:inline-flex; }
/* 时间维度切换 */
.seg { display:flex; background:#ECEAE3; border-radius:var(--radius-pill); padding:3px; margin:12px 0 10px; }
.seg-item { flex:1; text-align:center; padding:7px 0; font-size:13px; color:var(--ink-2); border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; gap:4px; }
.seg-item.active { background:var(--card); color:var(--brand); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.seg-item .lock { color:#B9B7AF; display:inline-flex; }
.lock-hint { font-size:10px; color:var(--ink-2); margin:-4px 6px 8px; display:flex; align-items:center; gap:4px; }
.lock-hint .ldot { width:3px; height:3px; border-radius:50%; background:var(--gold); flex:none; }
/* 卡片通用 */
.card { background:var(--card); border-radius:var(--radius-card); padding:14px 16px; margin-top:10px; box-shadow:0 1px 4px rgba(43,43,51,.04); }
/* 运势总览卡 */
.overview { border:1.5px solid var(--brand); }
.ov-head { display:flex; justify-content:space-between; align-items:center; }
.level { font-size:22px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
.badge-ji { font-size:12px; font-weight:700; color:#fff; background:var(--success); border-radius:8px; padding:2px 7px; }
.rizhu-tag { font-size:12px; color:var(--brand); background:var(--brand-soft); border-radius:var(--radius-pill); padding:4px 10px; font-weight:600; }
.press-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
.press-label { font-size:12px; color:var(--ink-2); flex:none; }
.bar { flex:1; height:8px; background:#EFEDE6; border-radius:var(--radius-pill); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--brand); border-radius:var(--radius-pill); }
.press-num { font-size:15px; font-weight:700; color:var(--brand); flex:none; width:28px; text-align:right; }
.year-banner { display:flex; justify-content:space-between; align-items:center; margin-top:12px; background:linear-gradient(90deg, #FBF7EF, #F6EDDA); border:1px solid rgba(201,168,106,.55); border-radius:12px; padding:9px 13px; }
.year-banner .t { font-size:12px; font-weight:700; color:var(--ink); }
.year-banner .t b { color:var(--gold); font-weight:800; }
.year-banner .go { font-size:12px; font-weight:700; color:var(--gold); flex:none; }
.gz-row { margin-top:10px; font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:8px; }
.gz-row b { color:var(--ink); font-size:15px; letter-spacing:1px; }
.shishen { font-size:11px; color:var(--gold); border:1px solid var(--gold); border-radius:var(--radius-pill); padding:1.5px 8px; }
.divider { height:1px; background:#F0EEE7; margin:13px -16px 0; }
.six-title { font-size:13px; font-weight:700; color:var(--ink); margin-top:12px; }
.six { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.six-row { display:flex; align-items:center; gap:10px; }
.six-row .s-name { flex:none; width:30px; font-size:12px; color:var(--ink-2); }
.six-row .bar { height:6px; }
.six-row .s-num { flex:none; width:24px; text-align:right; font-size:12px; font-weight:700; color:var(--brand); }
/* 宜忌卡 */
.yj-row { display:flex; align-items:center; gap:8px; }
.yj-row + .yj-row { margin-top:10px; }
.yj-label { flex:none; width:22px; height:22px; border-radius:7px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.yj-label.yi { color:#fff; background:var(--success); }
.yj-label.ji { color:#fff; background:var(--danger); }
.pill { font-size:13px; border-radius:var(--radius-pill); padding:5px 14px; font-weight:500; }
.pill.ok { color:var(--success); background:#E7F4EE; }
.pill.no { color:var(--danger); background:#FBEAE9; }
/* 行动建议卡 */
.card-title { font-size:15px; font-weight:700; color:var(--ink); }
.action p { font-size:13px; color:var(--ink); line-height:1.7; margin-top:8px; }
.action .reason { color:var(--ink-2); font-size:12px; }
.checkin { display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--brand); color:#fff; font-size:13px; font-weight:600; border-radius:var(--radius-pill); padding:8px 22px; }
.checkin .ck { font-size:12px; }
/* 近期压力卡 */
.stress-head { display:flex; justify-content:space-between; align-items:center; }
.link { font-size:12px; color:var(--brand); }
.sparkline { display:block; width:100%; height:56px; margin-top:10px; }
.days { display:flex; justify-content:space-between; font-size:10px; color:var(--ink-2); margin-top:4px; }
/* 对话引流 */
.goto-chat { margin-top:12px; background:var(--brand-soft); border-radius:var(--radius-card); padding:13px 16px; font-size:13px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; }
.goto-chat b { color:var(--brand); font-weight:700; }
/* 免责声明 */
.disclaimer { text-align:center; font-size:11px; color:var(--ink-2); margin:14px 0 10px; }
/* Tab栏 */
.tabbar { flex:none; background:var(--card); border-top:1px solid #ECEAE4; display:flex; padding:7px 0 24px; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--ink-2); }
.tab.active { color:var(--brand); font-weight:600; }
.home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#111; }
</style>
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#2B2B33"><rect x="0" y="6.5" width="3" height="4.5" rx="1"/><rect x="4.6" y="4.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="2.2" width="3" height="8.8" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#2B2B33" stroke-width="1.5" stroke-linecap="round"><path d="M1.5 3.6a10.5 10.5 0 0 1 13 0"/><path d="M3.9 6.3a7 7 0 0 1 8.2 0"/><circle cx="8" cy="9.2" r="1.4" fill="#2B2B33" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke="#2B2B33" stroke-opacity="0.35"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="#2B2B33"/><path d="M23.2 3.8v4.4c1-.3 1.6-1.2 1.6-2.2s-.6-1.9-1.6-2.2z" fill="#2B2B33" fill-opacity="0.4"/></svg>

  <div class="screen">

    <div class="topbar">

        <div class="greet">早安，小玲</div>

        </span>
      </div>

    <!-- 时间维度切换：日/周🔒/月🔒（周/月中期间上线） -->
    <div class="seg">

        <span class="press-label">压力指数</span>

      <div class="divider"></div>

      </div>
    </div>

    <!-- 年运报告入口横幅 -->
    <a href="10-year.html" style="text-decoration:none;color:inherit">
      <div class="year-banner">

        <span class="go">查看 →</span>

    <!-- 宜忌卡 -->
    <div class="card">

    <!-- 近期压力卡 -->

        <path d="M8 40 L60 33 L112 41 L164 28 L216 22 L268 12 L318 19 L318 56 L8 56 Z" fill="url(#sparkFill)"/>
        <polyline points="8,40 60,33 112,41 164,28 216,22 268,12 318,19" fill="none" stroke="#4A4E8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 对话引流 -->

    <!-- 免责声明 -->

  </div>

  <!-- Tab栏 -->
  <div class="tabbar">
    <div class="tab active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg>

  <div class="home-indicator"></div>
</div>
</body>
