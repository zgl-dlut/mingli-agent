events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 裸域名 HTTP → HTTPS 重定向到 www
    server {
        listen 80;
        server_name qusuansuan.com;
        return 301 https://www.qusuansuan.com$request_uri;
    }

    # www 域名 HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name www.qusuansuan.com;
        return 301 https://www.qusuansuan.com$request_uri;
    }

    # 用户前端 - www 主域名 HTTPS
    server {
        listen 443 ssl;
        server_name www.qusuansuan.com;

        ssl_certificate     /etc/nginx/ssl/www.qusuansuan.com.pem;
        ssl_certificate_key /etc/nginx/ssl/www.qusuansuan.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # 前端 SPA 路由 - index.html 不缓存
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        # API 接口
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后台管理 - admin子域名 HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name admin.qusuansuan.com;
        return 301 https://admin.qusuansuan.com$request_uri;
    }

    # 后台管理 - admin子域名 HTTPS
    server {
        listen 443 ssl;
        server_name admin.qusuansuan.com;

        ssl_certificate     /etc/nginx/ssl/www.qusuansuan.com.pem;
        ssl_certificate_key /etc/nginx/ssl/www.qusuansuan.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # admin根路径直接跳转到admin登录页
        location = / {
            return 302 /admin-login;
        }

        # 前端 SPA 路由 - index.html 不缓存
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        # API 接口
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
