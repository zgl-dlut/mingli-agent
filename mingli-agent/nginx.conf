# 用户前端 - 主域名
server {
    listen 80;
    server_name shisuansuan.com www.shisuansuan.com;

    # 前端静态资源
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 接口
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源缓存
    location /static/ {
        root /opt/mingli-agent/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/mingli-agent/frontend/dist/assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 后台管理 - 独立子域名 (admin.shisuansuan.com)
server {
    listen 80;
    server_name admin.shisuansuan.com;

    # 核心安全：基础认证 (Basic Auth)
    # 访问此域名的任何请求都需要用户名和密码
    auth_basic "Mingli Admin Panel";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 前端管理页面 (复用同一套前端代码，通过路由 /feedback 访问)
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
