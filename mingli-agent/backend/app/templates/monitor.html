<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣算算 - 系统监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f6f3; color: #333; }
        .header { background: #5D4037; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 500; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .status-ok { background: #4CAF50; }
        .status-error { background: #f44336; }
        .status-degraded { background: #ff9800; }
        .container { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; color: #5D4037; }
        .stat-value { font-size: 32px; font-weight: 700; color: #333; }
        .stat-label { font-size: 12px; color: #999; margin-top: 4px; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .progress-fill.green { background: #4CAF50; }
        .progress-fill.yellow { background: #ff9800; }
        .progress-fill.red { background: #f44336; }
        .table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .table th, .table td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        .table th { background: #f8f6f3; font-weight: 600; }
        .refresh-btn { background: #5D4037; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #4E342E; }
        .issues-list { list-style: none; margin-top: 12px; }
        .issues-list li { padding: 8px; background: #fff3e0; border-left: 4px solid #ff9800; margin-bottom: 8px; font-size: 13px; }
        .refresh-time { font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>趣算算 - 系统监控中心</h1>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span id="refreshTime" class="refresh-time">更新于: --:--:--</span>
            <button class="refresh-btn" onclick="loadData()">刷新</button>
        </div>
    </div>
    
    <div class="container">
        <div class="grid" style="margin-bottom: 24px;">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">系统状态</span>
                    <span id="systemStatus" class="status-badge status-ok">正常</span>
                </div>
                <div class="stat-value" id="version">v2.0.0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">用户总数</span>
                </div>
                <div class="stat-value" id="userCount">0</div>
                <div class="stat-label">已注册用户</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">消息总数</span>
                </div>
                <div class="stat-value" id="messageCount">0</div>
                <div class="stat-label">历史消息</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">AI模型</span>
                </div>
                <div class="stat-value" id="aiModel">--</div>
                <div class="stat-label" id="aiKeyStatus">API Key: 未配置</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">数据库状态</span>
                    <span id="dbStatus" class="status-badge">--</span>
                </div>
                <table class="table">
                    <tr><th>指标</th><th>数值</th></tr>
                    <tr><td>用户数</td><td id="dbPersonCount">--</td></tr>
                    <tr><td>消息数</td><td id="dbMessageCount">--</td></tr>
                </table>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">系统资源</span>
                </div>
                <div style="margin-bottom: 16px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>CPU</span>
                        <span id="cpuPercent">--%</span>
                    </div>
                    <div class="progress-bar"><div id="cpuBar" class="progress-fill" style="width: 0%"></div></div>
                </div>
                <div style="margin-bottom: 16px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>内存</span>
                        <span id="memoryPercent">--%</span>
                    </div>
                    <div class="progress-bar"><div id="memoryBar" class="progress-fill" style="width: 0%"></div></div>
                </div>
                <div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>磁盘</span>
                        <span id="diskPercent">--%</span>
                    </div>
                    <div class="progress-bar"><div id="diskBar" class="progress-fill" style="width: 0%"></div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">支付配置</span>
                </div>
                <table class="table">
                    <tr><th>支付方式</th><th>状态</th></tr>
                    <tr><td>微信支付</td><td id="wechatStatus">未配置</td></tr>
                    <tr><td>支付宝</td><td id="alipayStatus">未配置</td></tr>
                </table>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">内容质量告警</span>
                </div>
                <ul id="issuesList" class="issues-list">
                    <li>暂无告警</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/monitor/health');
                const data = await response.json();
                
                document.getElementById('systemStatus').className = `status-badge status-${data.status}`;
                document.getElementById('systemStatus').textContent = 
                    data.status === 'ok' ? '正常' : data.status === 'degraded' ? '降级' : '错误';
                document.getElementById('version').textContent = `v${data.version}`;
                document.getElementById('refreshTime').textContent = `更新于: ${new Date().toLocaleTimeString()}`;

                const db = data.components.database;
                document.getElementById('dbStatus').className = `status-badge status-${db.status}`;
                document.getElementById('dbStatus').textContent = db.status === 'ok' ? '正常' : '错误';
                document.getElementById('dbPersonCount').textContent = db.person_count || 0;
                document.getElementById('dbMessageCount').textContent = db.message_count || 0;

                const ai = data.components.ai_model;
                document.getElementById('aiModel').textContent = ai.model;
                document.getElementById('aiKeyStatus').textContent = ai.has_api_key ? 'API Key: 已配置' : 'API Key: 未配置';

                const sys = data.components.system;
                document.getElementById('cpuPercent').textContent = `${sys.cpu_percent}%`;
                document.getElementById('cpuBar').style.width = `${sys.cpu_percent}%`;
                document.getElementById('cpuBar').className = getProgressClass(sys.cpu_percent);
                document.getElementById('memoryPercent').textContent = `${sys.memory_percent}%`;
                document.getElementById('memoryBar').style.width = `${sys.memory_percent}%`;
                document.getElementById('memoryBar').className = getProgressClass(sys.memory_percent);
                document.getElementById('diskPercent').textContent = `${sys.disk_usage_percent}%`;
                document.getElementById('diskBar').style.width = `${sys.disk_usage_percent}%`;
                document.getElementById('diskBar').className = getProgressClass(sys.disk_usage_percent);

                const payment = data.components.payment;
                document.getElementById('wechatStatus').textContent = payment.wechat_configured ? '已配置' : '未配置';
                document.getElementById('alipayStatus').textContent = payment.alipay_configured ? '已配置' : '未配置';

                const statsResponse = await fetch('/api/monitor/stats');
                const stats = await statsResponse.json();
                document.getElementById('userCount').textContent = stats.metrics.total_users;
                document.getElementById('messageCount').textContent = stats.metrics.total_messages;

            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('systemStatus').className = 'status-badge status-error';
                document.getElementById('systemStatus').textContent = '连接失败';
            }
        }

        function getProgressClass(percent) {
            if (percent > 80) return 'progress-fill red';
            if (percent > 60) return 'progress-fill yellow';
            return 'progress-fill green';
        }

        window.onload = loadData;
        setInterval(loadData, 30000);
    </script>
</body>
</html>
