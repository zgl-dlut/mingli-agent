version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mingli-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mingli123
      MYSQL_DATABASE: mingli
      MYSQL_USER: mingli
      MYSQL_PASSWORD: mingli123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mingli-agent-backend:latest
    container_name: mingli-backend
    # 直接注入 backend/.env 的所有变量（镜像内不含 .env，靠这里传入）
    # 注意：下方 environment 里的同名变量优先级更高（如 DATABASE_URL 指向容器内 mysql）
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://mingli:mingli123@mysql:3306/mingli
      SECRET_KEY: mingli-agent-production-secret-key-2026-qusuansuan
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.8-max}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_MODELS: ${AI_MODELS:-qwen3.8-max}
      # 短信服务配置
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-北京维梦文化}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-SMS_337485609}
      SMS_MOCK_MODE: ${SMS_MOCK_MODE:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-your-wechat-app-id}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_API_KEY: ${WECHAT_API_KEY}
      WECHAT_CERT_PATH: /app/certs/apiclient_cert.pem
      WECHAT_KEY_PATH: /app/certs/apiclient_key.pem
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO}
      WECHAT_NOTIFY_URL: https://www.qusuansuan.com/api/payment/wechat/callback
      WECHAT_OAUTH_REDIRECT_URI: ${WECHAT_OAUTH_REDIRECT_URI:-https://www.qusuansuan.com/api/auth/wechat-callback}
      WECHAT_PUBLIC_KEY_ID: ${WECHAT_PUBLIC_KEY_ID}
      WECHAT_PUBLIC_KEY_PATH: /app/certs/wechat_public_key.pem
      BONUS_PHONE_LIST: ${BONUS_PHONE_LIST:-}
      BONUS_POINTS: ${BONUS_POINTS:-1000}
    volumes:
      - ./backend/certs:/app/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: mingli-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 前端构建产物（本地已 build 好的 dist）
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 后台管理密码文件
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      # SSL 证书
      - ./certs/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
